name: Publish

# Publishing is manual today: 0.0.1 went out from somebody's laptop on
# 2026-09-12 and nothing has shipped since, so main has carried unpublished
# work -- the VAPI adapter and the ElevenLabs end-of-call fix -- with no signal
# that npm was behind.
#
# Cutting a GitHub Release is now the trigger. Tag it v<version> matching
# package.json; the guard below refuses the mismatch rather than publishing
# something nobody meant to.
on:
  release:
    types: [published]
  # For a release that was cut before this workflow existed, or a retry after a
  # transient registry failure.
  workflow_dispatch:

# The package is published through npm trusted publishing: npm trusts this
# repository and workflow filename directly, so there is no token to leak or
# rotate. id-token: write is what lets the runner mint the OIDC token that
# stands in for one.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1; Node 22 still bundles npm 10.
      # Without this the publish falls back to looking for a token and fails.
      - run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Release tag matches package.json version
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}"
            exit 1
          fi
      # prepack runs build + test, so a broken tree cannot be published.
      # No --provenance flag: trusted publishing attests a public repository's
      # packages on its own.
      - run: npm publish
